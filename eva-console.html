<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eva Console — Experiment</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f4f6f8; color: #1c2b33; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1c2b33; color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 15px; font-weight: 600; }
  header .badge { background: #67c9ba; color: #1c2b33; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  header .right { margin-left: auto; font-size: 12px; opacity: .7; }
  main { flex: 1; display: flex; min-height: 0; }
  #threads { width: 300px; border-right: 1px solid #dde3e8; background: #fff; overflow-y: auto; }
  .thread-item { padding: 12px 14px; border-bottom: 1px solid #eef1f4; cursor: pointer; }
  .thread-item:hover { background: #f7fafb; }
  .thread-item.active { background: #e8f5f2; }
  .thread-item .subj { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-item .meta { font-size: 11px; color: #6b7a85; margin-top: 3px; display: flex; justify-content: space-between; }
  .chip { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 9px; }
  .chip.unread { background: #ffe9d6; color: #b4560f; }
  .chip.processing { background: #fff3bf; color: #8a6d00; }
  .chip.replied { background: #d3f2e9; color: #0d6e5a; }
  .chip.error { background: #ffd6d6; color: #a11; }
  .chip.ignored { background: #e4e8eb; color: #566; }
  #view { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { background: #fff; border: 1px solid #dde3e8; border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; max-width: 760px; }
  .msg.outbound { border-left: 4px solid #67c9ba; }
  .msg.inbound { border-left: 4px solid #f9a67e; }
  .msg .hdr { font-size: 12px; color: #6b7a85; margin-bottom: 10px; line-height: 1.5; }
  .msg .hdr b { color: #1c2b33; }
  .msg pre { white-space: pre-wrap; font-family: inherit; font-size: 13.5px; line-height: 1.55; }
  .msg .att { margin-top: 10px; font-size: 12px; background: #f4f6f8; border-radius: 6px; padding: 8px 10px; color: #566; }
  .why-btn { margin-top: 10px; font-size: 12px; background: none; border: 1px solid #c6d0d7; border-radius: 6px; padding: 4px 10px; cursor: pointer; color: #38626b; }
  .why { display: none; margin-top: 10px; background: #f8fafb; border: 1px solid #e3e9ed; border-radius: 8px; padding: 12px; font-size: 12px; overflow-x: auto; }
  .why table { border-collapse: collapse; width: 100%; }
  .why td, .why th { padding: 3px 8px; border-bottom: 1px solid #e8edf0; text-align: left; vertical-align: top; }
  .why .ev { color: #8a6d00; font-style: italic; }
  .why .flag { color: #a11; font-weight: 600; }
  #composerWrap { border-top: 1px solid #dde3e8; background: #fff; padding: 14px 20px; }
  #composerWrap .row { display: flex; gap: 10px; margin-bottom: 8px; }
  input, textarea { font: inherit; font-size: 13px; border: 1px solid #c6d0d7; border-radius: 6px; padding: 7px 10px; width: 100%; }
  textarea { resize: vertical; }
  button.primary { background: #1c2b33; color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.primary:hover { background: #2d4550; }
  #newBtn { background: #67c9ba; color: #1c2b33; border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 700; font-size: 12px; cursor: pointer; margin: 12px 14px; }
  .hint { font-size: 11px; color: #8b98a1; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Eva Console</h1><span class="badge">EXPERIMENT · MIMIC MAIL</span>
  <span class="right" id="connState">connecting…</span>
</header>
<main>
  <div id="threads"><button id="newBtn">+ New enquiry</button><div id="threadList"></div></div>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div id="view"><p style="color:#8b98a1;padding:20px">Select a thread, or send a new enquiry as a broker. Eva's worker replies within ~10s of its next poll.</p></div>
    <div id="composerWrap"></div>
  </div>
</main>
<script>
const SUPABASE_URL = 'https://jiximtizoodrpvfjdxaq.supabase.co';
const ANON_KEY = 'sb_publishable_0IYsHAvGYry8FHVS7s2hUg_qI9lvkXm';
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY.trim());
let threads = {}, activeThread = null, decisionsCache = {};

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

async function loadThreads(){
  const {data,error} = await sb.from('mimic_messages').select('*').order('created_at');
  if (error){document.getElementById('connState').textContent='DB error: '+error.message;return;}
  document.getElementById('connState').textContent='connected';
  threads = {};
  for (const m of data){(threads[m.thread_id] ||= []).push(m);}
  renderThreadList();
  if (activeThread) renderThread(activeThread);
}

function renderThreadList(){
  const el = document.getElementById('threadList');
  const items = Object.entries(threads).sort((a,b)=>
    b[1][b[1].length-1].created_at.localeCompare(a[1][a[1].length-1].created_at));
  el.innerHTML = items.map(([tid,msgs])=>{
    const first = msgs.find(m=>m.direction==='inbound') || msgs[0];
    const last = msgs[msgs.length-1];
    const inb = msgs.filter(m=>m.direction==='inbound');
    const st = inb.length ? inb[inb.length-1].status : last.status;
    return `<div class="thread-item ${tid===activeThread?'active':''}" onclick="openThread('${tid}')">
      <div class="subj">${esc(first.subject||'(no subject)')}</div>
      <div class="meta"><span>${esc(first.from_name||first.from_email||'')} · ${msgs.length} msg</span>
      <span class="chip ${st}">${st}</span></div></div>`;
  }).join('');
}

window.openThread = function(tid){ activeThread = tid; renderThreadList(); renderThread(tid); renderComposer('reply'); };

async function renderThread(tid){
  const msgs = threads[tid]||[];
  const view = document.getElementById('view');
  view.innerHTML = msgs.map(m=>`
    <div class="msg ${m.direction}">
      <div class="hdr"><b>${esc(m.from_name||m.from_email)}</b> &lt;${esc(m.from_email||'')}&gt;
        ${m.cc_emails&&m.cc_emails.length?` · cc: ${esc(m.cc_emails.join(', '))}`:''}
        · ${new Date(m.created_at).toLocaleString('en-GB')}
        · <span class="chip ${m.status}">${m.status}</span><br><b>${esc(m.subject||'')}</b></div>
      <pre>${esc(m.body)}</pre>
      ${m.attachments_text?`<div class="att"><b>Attachment text:</b><br>${esc(m.attachments_text.slice(0,600))}${m.attachments_text.length>600?'…':''}</div>`:''}
      ${m.direction==='outbound'?`<button class="why-btn" onclick="toggleWhy('${m.id}',this)">Why did Eva do this?</button><div class="why" id="why-${m.id}"></div>`:''}
    </div>`).join('');
  view.scrollTop = view.scrollHeight;
}

window.toggleWhy = async function(msgId, btn){
  const box = document.getElementById('why-'+msgId);
  if (box.style.display==='block'){box.style.display='none';return;}
  box.style.display='block';
  if (!decisionsCache[msgId]){
    // decision rows key on the INBOUND message id; find it via the thread
    const msgs = threads[activeThread]||[];
    const idx = msgs.findIndex(m=>m.id===msgId);
    const inbound = msgs.slice(0,idx).reverse().find(m=>m.direction==='inbound');
    const {data} = await sb.from('enquiry_decisions').select('*')
      .eq('message_id', inbound?inbound.id:msgId).order('created_at',{ascending:false}).limit(1);
    decisionsCache[msgId] = data&&data[0];
  }
  const d = decisionsCache[msgId];
  if (!d){box.innerHTML='<i>No decision record found.</i>';return;}
  const dec = d.decision||{};
  let rows = '';
  for (const [k,f] of Object.entries(d.extraction||{})){
    if (f && f.value) rows += `<tr><td>${esc(k)}</td><td>${esc(String(f.value))}</td>
      <td>${(f.confidence*100).toFixed(0)}%</td><td class="ev">${esc(f.evidence||'')}</td></tr>`;
  }
  box.innerHTML = `
    <p><b>Outcome:</b> ${esc(dec.outcome)} · <b>Route:</b> ${esc((dec.routing||{}).bdm)} (${(((dec.routing||{}).confidence)*100||0).toFixed(0)}%) · <b>Model:</b> ${esc(d.model||'')}</p>
    ${(d.guard_flags||[]).length?`<p class="flag">Guards: ${esc(d.guard_flags.join(', '))}</p>`:''}
    ${(dec.adverse_disclosures||[]).length?`<p><b>Adverse:</b> ${dec.adverse_disclosures.map(a=>esc(a.summary)).join(' · ')}</p>`:''}
    <p><b>Internal note:</b> ${esc(dec.internal_note||'')}</p>
    <table><tr><th>Field</th><th>Value</th><th>Conf</th><th>Evidence</th></tr>${rows}</table>`;
}

function renderComposer(mode){
  const w = document.getElementById('composerWrap');
  if (mode==='reply' && activeThread){
    w.innerHTML = `<div class="row"><input id="c_name" placeholder="Broker name" value="${esc(localStorage.getItem('eva_broker_name')||'Sunny Bassi')}">
      <input id="c_email" placeholder="Broker email" value="${esc(localStorage.getItem('eva_broker_email')||'sunny@examplebrokerage.co.uk')}"></div>
      <div class="row"><textarea id="c_body" rows="3" placeholder="Reply as the broker…"></textarea></div>
      <div class="row"><button class="primary" onclick="sendMsg(false)">Send reply as broker</button></div>`;
  } else {
    w.innerHTML = `<div class="row"><input id="c_name" placeholder="Broker name" value="Sunny Bassi">
      <input id="c_email" placeholder="Broker email" value="sunny@examplebrokerage.co.uk">
      <input id="c_subject" placeholder="Subject" value="New enquiry"></div>
      <div class="row"><textarea id="c_body" rows="6" placeholder="Paste the enquiry email body…"></textarea></div>
      <div class="row"><textarea id="c_att" rows="2" placeholder="Optional: paste attachment text (valuation extract, A&L, particulars…)"></textarea></div>
      <div class="row"><button class="primary" onclick="sendMsg(true)">Send enquiry to Eva</button></div>
      <div class="hint">Creates an unread inbound message; the worker picks it up on its next poll.</div>`;
  }
}

document.getElementById('newBtn').onclick = ()=>{activeThread=null;renderThreadList();
  document.getElementById('view').innerHTML='';renderComposer('new');};

window.sendMsg = async function(isNew){
  const name = document.getElementById('c_name').value.trim();
  const email = document.getElementById('c_email').value.trim();
  const body = document.getElementById('c_body').value.trim();
  if (!body) return alert('Body required');
  localStorage.setItem('eva_broker_name',name); localStorage.setItem('eva_broker_email',email);
  const row = {
    thread_id: isNew ? crypto.randomUUID() : activeThread,
    direction:'inbound', from_name:name, from_email:email, to_email:'eva@alba.loans',
    subject: isNew ? document.getElementById('c_subject').value.trim()
                   : (threads[activeThread][0].subject||''),
    body, status:'unread',
    attachments_text: isNew ? (document.getElementById('c_att').value.trim()||null) : null,
  };
  const {data,error} = await sb.from('mimic_messages').insert(row).select();
  if (error) return alert(error.message);
  activeThread = data[0].thread_id;
  await loadThreads(); renderComposer('reply');
};

// realtime + polling fallback
try {
  sb.channel('mimic').on('postgres_changes',{event:'*',schema:'public',table:'mimic_messages'},loadThreads).subscribe();
} catch(e){}
setInterval(loadThreads, 8000);
loadThreads(); renderComposer('new');
</script>
</body>
</html>
