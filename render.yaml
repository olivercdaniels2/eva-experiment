services:
  - type: worker
    name: eva-enquiry-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.main
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://jiximtizoodrpvfjdxaq.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MAILBOX
        value: mimic
      - key: POLL_SECONDS
        value: "10"
